<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarmLink — Screen Sketches &amp; Annotations</title>
<style>
@page { size: A4 portrait; margin: 14mm 15mm; }

:root{
  --ink:#1c1c1c;
  --grey:#6b6b6b;
  --light:#a9a9a9;
  --hair:#d6d6d6;
  --fill:#f0f0f0;
  --accent:#2e6b34;
  --paper:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Helvetica Neue",Helvetica,Arial,"PingFang TC","Noto Sans TC",sans-serif;
  color:var(--ink);background:#e8e8e6;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}

/* ---------- page shell ---------- */
.page{
  width:210mm;min-height:297mm;background:var(--paper);
  margin:0 auto 8mm;padding:14mm 15mm;position:relative;
  box-shadow:0 2px 14px rgba(0,0,0,.16);
  display:flex;flex-direction:column;
}
.page + .page{break-before:page}
.pg-head{
  display:flex;align-items:baseline;gap:8px;
  border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:10px;flex:0 0 auto;
}
.pg-head .num{font-size:10pt;font-weight:800;letter-spacing:.5px}
.pg-head .nm{font-size:13pt;font-weight:800;letter-spacing:-.2px}
.pg-head .sp{flex:1}
.badge{
  font-size:7pt;font-weight:800;letter-spacing:.7px;text-transform:uppercase;
  border:1.2px solid var(--ink);border-radius:2px;padding:2px 6px;white-space:nowrap;
}
.badge.charity{background:var(--ink);color:#fff}
.pg-foot{
  margin-top:auto;padding-top:6px;border-top:1px solid var(--hair);
  font-size:7.5pt;color:var(--light);display:flex;justify-content:space-between;flex:0 0 auto;
}

/* ---------- two-column screen layout ---------- */
.split{display:flex;gap:8mm;flex:1;align-items:flex-start}
.col-wf{flex:0 0 78mm}
.col-notes{flex:1;min-width:0}

/* ---------- wireframe device ---------- */
.wf{
  width:78mm;border:2px solid var(--ink);border-radius:7mm;
  padding:2.2mm;background:#fff;
}
/* Fixed device proportions so every sketch reads as the same phone and the
   bottom nav anchors to the bottom edge as it does in the prototype. */
.wf-inner{
  border:1px solid var(--hair);border-radius:5mm;background:#fff;
  min-height:160mm;display:flex;flex-direction:column;
}
.wf-inner > .at-bottom{margin-top:auto}
.wf-cap{
  text-align:center;font-size:7pt;color:var(--light);margin-top:3px;letter-spacing:.4px;
}

/* wireframe primitives */
.b{position:relative;margin:0 0 2mm}
.pad{padding:0 3mm}
.status{
  display:flex;justify-content:space-between;align-items:center;
  padding:1.6mm 3.4mm 1mm;font-size:6pt;color:var(--light);font-weight:700;
}
.status .sig{display:flex;gap:1.2px;align-items:flex-end}
.status .sig i{width:1.2px;height:3px;background:var(--light);display:block}
.status .sig i:nth-child(2){height:4px}.status .sig i:nth-child(3){height:5px}
.status .bat{width:9px;height:5px;border:.7px solid var(--light);border-radius:1px}

.appbar{display:flex;align-items:center;gap:2mm;padding:1.4mm 3mm 2mm}
.appbar .chev{
  width:3mm;height:3mm;border-left:1.2px solid var(--ink);border-bottom:1.2px solid var(--ink);
  transform:rotate(45deg);flex:0 0 auto;margin-left:.6mm;
}
.appbar .ttl{flex:1;text-align:center;font-size:8pt;font-weight:800}
.appbar .sq{
  width:5mm;height:5mm;border:1px solid var(--light);border-radius:1.4mm;flex:0 0 auto;
  display:grid;place-items:center;font-size:5.5pt;color:var(--grey);
}

.h1{font-size:11pt;font-weight:800;letter-spacing:-.3px;padding:0 3mm}
.h2{font-size:8.5pt;font-weight:800;padding:0 3mm}
.sub{font-size:6.5pt;color:var(--grey);padding:0 3mm;line-height:1.4}
.sect{
  font-size:5.8pt;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--light);padding:0 3mm;margin:1.4mm 0 1mm;
}

.ln{height:1.6mm;background:var(--fill);border-radius:.8mm;margin-bottom:1mm}
.img{
  border:1px dashed var(--light);border-radius:1.6mm;position:relative;background:#fafafa;
  display:grid;place-items:center;font-size:6pt;color:var(--light);overflow:hidden;
}
.img::before,.img::after{
  content:"";position:absolute;inset:0;border-top:1px dashed #e2e2e2;
  transform-origin:0 0;
}
.img::before{transform:rotate(var(--ang,0deg))}
.img.x::before{width:141%;transform:rotate(35deg)}
.img.x::after{width:141%;top:auto;bottom:0;transform:rotate(-35deg);transform-origin:0 100%}

.field{
  border:1px solid var(--hair);border-radius:1.4mm;padding:1.6mm 2mm;
  display:flex;align-items:center;gap:2mm;font-size:6.5pt;margin-bottom:1.4mm;
}
.field .fl{font-weight:700;flex:0 0 auto}
.field .fv{flex:1;text-align:right;color:var(--light)}

.btn{
  border:1.4px solid var(--ink);border-radius:1.6mm;text-align:center;
  padding:2mm;font-size:7.5pt;font-weight:800;margin-bottom:1.4mm;
}
.btn.solid{background:var(--ink);color:#fff}
.btn.ghost{border-style:dashed;color:var(--grey);border-color:var(--light);font-weight:700}
/* destructive: solid outline, distinct from both filled primary and dashed secondary */
.btn.danger{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.2px #fff, inset 0 0 0 2.6px var(--ink)}

.card{border:1px solid var(--hair);border-radius:1.8mm;padding:2mm}
.row{display:flex;align-items:center;gap:2mm}
.av{
  width:6mm;height:6mm;border:1px solid var(--light);border-radius:1.4mm;flex:0 0 auto;
  display:grid;place-items:center;font-size:6pt;color:var(--grey);
}
.av.rd{border-radius:50%}
.grow{flex:1;min-width:0}
.tiny{font-size:6pt;color:var(--grey);line-height:1.35}
.nano{font-size:5.5pt;color:var(--light)}
.b7{font-weight:700}.b8{font-weight:800}
.f7{font-size:7pt}.f65{font-size:6.5pt}

.pill{
  border:1px solid var(--light);border-radius:3mm;padding:.6mm 1.8mm;
  font-size:5.5pt;font-weight:800;color:var(--grey);white-space:nowrap;
}
.pill.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

.chips{display:flex;gap:1.4mm;padding:0 3mm;overflow:hidden}
.chip{
  border:1px solid var(--light);border-radius:3mm;padding:.8mm 2mm;
  font-size:5.8pt;font-weight:700;color:var(--grey);white-space:nowrap;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.8mm;padding:0 3mm}
.tile{border:1px solid var(--hair);border-radius:1.8mm;padding:2mm;min-height:13mm}
.tile .ic{width:4.5mm;height:4.5mm;border:1.2px solid var(--grey);border-radius:1mm;margin-bottom:1.4mm}
.tile .tl{font-size:6.5pt;font-weight:800}
.tile .ts{font-size:5.5pt;color:var(--light);margin-top:.4mm}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1.6mm;padding:0 3mm}
.kpi{border:1px solid var(--hair);border-radius:1.6mm;padding:1.8mm}
.kpi .kv{font-size:9pt;font-weight:800}
.kpi .kl{font-size:5.3pt;color:var(--light);font-weight:700}

.chart{display:flex;align-items:flex-end;gap:1.6mm;height:20mm;padding:0 1mm}
.chart .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:1mm;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--fill);border:1px solid var(--light);border-radius:.8mm .8mm 0 0}
.chart .bl{font-size:5pt;color:var(--light)}

.bub{
  border:1px solid var(--light);border-radius:2.4mm;padding:1.4mm 2mm;font-size:6pt;
  max-width:72%;margin-bottom:1.4mm;line-height:1.35;
}
.bub.me{margin-left:auto;background:var(--fill);border-color:var(--grey);border-bottom-right-radius:.6mm}
.bub.you{border-bottom-left-radius:.6mm}
.bub .q{border-left:1.4px solid var(--light);padding-left:1.4mm;color:var(--light);font-size:5.3pt;margin-bottom:.8mm}
.composer{
  display:flex;gap:1.6mm;align-items:center;padding:2mm 3mm;border-top:1px solid var(--hair);
}
.composer .inp{flex:1;border:1px solid var(--hair);border-radius:3mm;padding:1.4mm 2mm;font-size:6pt;color:var(--light)}

.tabbar{display:flex;border-top:1px solid var(--hair);padding:1.6mm 0 2mm}
.tabbar .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:.8mm}
.tabbar .t .ti{width:4mm;height:4mm;border:1.1px solid var(--light);border-radius:1mm}
.tabbar .t .tl{font-size:4.8pt;color:var(--light);font-weight:700}
.tabbar .t.on .ti{border-color:var(--ink);border-width:1.6px;background:var(--fill)}
.tabbar .t.on .tl{color:var(--ink)}

.qr{
  width:32mm;height:32mm;margin:0 auto;padding:1.4mm;background:#fff;
  border:1px solid var(--hair);border-radius:1.4mm;
  display:grid;grid-template-columns:repeat(21,1fr);gap:0;
}
.qr i{background:transparent}
.qr i.on{background:var(--ink)}
.scan{
  width:30mm;height:30mm;margin:0 auto;border:1px solid var(--ink);border-radius:2mm;
  position:relative;background:#fafafa;
}
.scan .c{position:absolute;width:5mm;height:5mm;border:1.4px solid var(--ink)}
.scan .c1{top:1.6mm;left:1.6mm;border-right:0;border-bottom:0}
.scan .c2{top:1.6mm;right:1.6mm;border-left:0;border-bottom:0}
.scan .c3{bottom:1.6mm;left:1.6mm;border-right:0;border-top:0}
.scan .c4{bottom:1.6mm;right:1.6mm;border-left:0;border-top:0}
.scan .sl{position:absolute;left:1.6mm;right:1.6mm;top:14mm;border-top:1.4px dashed var(--ink)}
.scan .sl::after{
  content:"scan";position:absolute;right:0;top:.6mm;font-size:4.6pt;color:var(--light);
}

.mascot{display:block;margin:0 auto}
.confetti{display:flex;justify-content:center;gap:1.4mm;margin-bottom:1.4mm}
.confetti i{width:1.2mm;height:2.4mm;border:.8px solid var(--light);border-radius:.4mm;display:block}
.confetti i:nth-child(2n){transform:rotate(28deg)}
.confetti i:nth-child(3n){transform:rotate(-34deg);border-radius:50%}

/* ---------- callout markers ---------- */
.co{
  position:absolute;left:-4.6mm;top:0;
  width:3.8mm;height:3.8mm;border-radius:50%;
  border:1.2px solid var(--ink);background:#fff;
  font-size:5.6pt;font-weight:800;display:grid;place-items:center;z-index:5;
}
.co.r{left:auto;right:-4.6mm}
.wf{overflow:visible}
.wf-inner{overflow:visible}

/* ---------- annotations panel ---------- */
.notes h4{
  font-size:6pt;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--light);margin:0 0 2mm;padding-bottom:1mm;border-bottom:1px solid var(--hair);
}
.notes + .notes{margin-top:4.5mm}
.purpose{font-size:8pt;line-height:1.5;margin:0}
.alist{list-style:none;margin:0;padding:0}
.alist li{
  display:flex;gap:2.4mm;font-size:7.5pt;line-height:1.45;margin-bottom:2mm;
}
.alist .n{
  flex:0 0 auto;width:3.8mm;height:3.8mm;border-radius:50%;border:1.2px solid var(--ink);
  font-size:5.6pt;font-weight:800;display:grid;place-items:center;margin-top:.4mm;
}
.ilist{list-style:none;margin:0;padding:0;font-size:7.5pt;line-height:1.45}
.ilist li{position:relative;padding-left:4mm;margin-bottom:1.6mm}
.ilist li::before{
  content:"";position:absolute;left:0;top:1.5mm;width:2mm;height:2mm;
  border:1.2px solid var(--grey);border-radius:50%;
}
.ilist li.anim::before{background:var(--ink);border-color:var(--ink)}
.specref{
  font-size:7pt;line-height:1.5;background:#f7f7f5;border-left:2.4px solid var(--ink);
  padding:2mm 2.6mm;margin:0;
}
.specref code{font-family:inherit;font-weight:800}

/* ---------- cover ---------- */
.cover{justify-content:center;text-align:center}
.cover .logo{font-size:34pt;font-weight:800;letter-spacing:-1.5px;margin-bottom:2mm}
.cover .logo .g{color:var(--accent)}
.cover .tag{font-size:10pt;color:var(--grey);margin-bottom:14mm}
.cover .title{font-size:19pt;font-weight:800;letter-spacing:-.4px;margin-bottom:3mm}
.cover .meta{font-size:9pt;color:var(--grey);line-height:1.8;margin-top:14mm}
.cover hr{border:0;border-top:1.5px solid var(--ink);width:34mm;margin:8mm auto}

/* ---------- index / legend tables ---------- */
table{width:100%;border-collapse:collapse;font-size:8pt}
th{
  text-align:left;font-size:6pt;letter-spacing:1px;text-transform:uppercase;color:var(--light);
  border-bottom:1.2px solid var(--ink);padding:0 2mm 1.6mm;
}
td{padding:1.8mm 2mm;border-bottom:1px solid var(--hair);vertical-align:top;line-height:1.4}
td.c{width:9mm;font-weight:800}
td.r{width:22mm}
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm 9mm;margin-top:3mm}
.lg{display:flex;gap:3mm;align-items:flex-start}
.lg .demo{flex:0 0 26mm}
.lg .txt{font-size:7.5pt;line-height:1.45}
.lg .txt b{display:block;font-size:8pt;margin-bottom:.6mm}

/* ---------- flow map ---------- */
.flow{display:flex;flex-direction:column;gap:3mm;margin-top:3mm}
.frow{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.fbox{
  border:1.4px solid var(--ink);border-radius:1.6mm;padding:2mm 2.6mm;
  font-size:7pt;font-weight:700;text-align:center;min-width:26mm;
}
.fbox.alt{border-style:dashed;color:var(--grey)}
.arr{
  flex:0 0 8mm;height:0;border-top:1.2px solid var(--ink);position:relative;
}
.arr::after{
  content:"";position:absolute;right:0;top:-1.4mm;
  border-left:2mm solid var(--ink);border-top:1.4mm solid transparent;border-bottom:1.4mm solid transparent;
}
.flabel{font-size:6pt;color:var(--light);text-align:center;flex:0 0 8mm;margin-top:-3mm}

/* ---------- screen-only toolbar ---------- */
.bar-print{
  position:fixed;top:0;left:0;right:0;z-index:99;
  background:var(--ink);color:#fff;padding:8px 16px;
  display:flex;align-items:center;gap:14px;font-size:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.3);
}
.bar-print b{font-size:13px}
.bar-print .sp{flex:1}
.bar-print button{
  background:#fff;color:var(--ink);border:0;border-radius:5px;
  padding:6px 14px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit;
}
.bar-print button:hover{background:#e8e8e6}
.bar-print span{opacity:.8}
body{padding-top:44px}

@media print{
  body{background:#fff;padding-top:0}
  .bar-print{display:none}
  .page{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}
  .page + .page{break-before:page}
  .split{break-inside:avoid}
}
</style>
</head>
<body>

<div class="bar-print">
  <b>FarmLink — Screen Sketches</b>
  <span>25 screens · A4 booklet</span>
  <span id="overflow"></span>
  <div class="sp"></div>
  <span>Print / Save as PDF →</span>
  <button onclick="window.print()">Print</button>
</div>

<div id="doc"></div>

<script>
/* =====================================================================
   Wireframe primitives — each block may carry {note:n} to place a
   numbered callout marker that matches the annotation list.
   ===================================================================== */
const co = b => b.note ? `<span class="co${b.side==='r'?' r':''}">${b.note}</span>` : '';
const wrap = (b, inner, cls='') => `<div class="b ${cls}">${co(b)}${inner}</div>`;

const P = {
  status: b => `<div class="b">${co(b)}<div class="status">
      <span>9:41</span>
      <span class="row" style="gap:1.4mm">
        <span class="sig"><i></i><i></i><i></i></span><span class="bat"></span>
      </span></div></div>`,

  appbar: b => wrap(b, `<div class="appbar">
      ${b.back?'<span class="chev"></span>':'<span style="width:5mm"></span>'}
      <span class="ttl">${b.title||''}</span>
      ${b.right?`<span class="sq">${b.right}</span>`:'<span style="width:5mm"></span>'}
    </div>`),

  greet: b => wrap(b, `<div style="padding:1mm 3mm 2mm" class="row">
      <div class="grow"><div class="h1" style="padding:0">${b.title}</div>
      <div class="sub" style="padding:0;margin-top:.6mm">${b.sub||''}</div></div>
      ${b.right?`<span class="sq">${b.right}</span>`:''}
    </div>`),

  h1:   b => wrap(b, `<div class="h1">${b.text}</div>`),
  h2:   b => wrap(b, `<div class="h2">${b.text}</div>`),
  sub:  b => wrap(b, `<div class="sub">${b.text}</div>`),
  sect: b => wrap(b, `<div class="sect">${b.text}</div>`),

  lines: b => wrap(b, `<div class="pad">${(b.w||[92,74,58]).map(w=>
      `<div class="ln" style="width:${w}%"></div>`).join('')}</div>`),

  img: b => wrap(b, `<div class="pad"><div class="img x" style="height:${b.h||18}mm">${b.label||''}</div></div>`),

  field: b => wrap(b, `<div class="pad"><div class="field">
      <span class="fl">${b.label}</span><span class="fv">${b.value||'—'}</span></div></div>`),

  btn: b => wrap(b, `<div class="pad"><div class="btn ${b.style||'solid'}">${b.label}</div></div>`),

  btnrow: b => wrap(b, `<div class="pad"><div class="row" style="gap:1.8mm;margin-bottom:1.4mm">
      ${b.items.map(([l,st])=>`<div class="btn ${st||'solid'}" style="flex:1;margin:0">${l}</div>`).join('')}
    </div></div>`),

  hero: b => wrap(b, `<div class="pad"><div class="btn solid" style="text-align:left;padding:2.6mm 2.6mm">
      <div style="font-size:8pt">${b.title}</div>
      <div style="font-size:5.6pt;font-weight:600;opacity:.85;margin-top:.6mm">${b.sub||''}</div></div></div>`),

  grid2: b => wrap(b, `<div class="grid2">${b.items.map(([t,s])=>
      `<div class="tile"><div class="ic"></div><div class="tl">${t}</div><div class="ts">${s}</div></div>`).join('')}</div>`),

  chips: b => wrap(b, `<div class="chips">${b.items.map((t,i)=>
      `<div class="chip${i===(b.active??0)?' on':''}">${t}</div>`).join('')}</div>`),

  search: b => wrap(b, `<div class="pad"><div class="field">
      <span class="av" style="width:4mm;height:4mm;border-radius:50%">q</span>
      <span class="fv" style="text-align:left">${b.label||'Search…'}</span></div></div>`),

  listing: b => wrap(b, `<div class="pad"><div class="card" style="padding:0;overflow:hidden">
      <div class="img" style="height:${b.h||13}mm;border:0;border-bottom:1px dashed var(--light);border-radius:0">${b.photo||'photo'}</div>
      <div style="padding:1.8mm 2mm">
        <div class="row"><span class="b8 f7">${b.name}</span><span class="grow"></span><span class="b8 f7">${b.price||''}</span></div>
        <div class="row" style="margin-top:.8mm"><span class="nano">${b.meta||''}</span><span class="grow"></span>${b.pill?`<span class="pill">${b.pill}</span>`:''}</div>
        ${b.foot?`<div class="nano" style="margin-top:.8mm">${b.foot}</div>`:''}
        ${b.actions?`<div class="row" style="gap:1.4mm;margin-top:1.6mm">${b.actions.map(a=>
          `<span class="pill">${a}</span>`).join('')}</div>`:''}
      </div></div></div>`),

  rowcard: b => wrap(b, `<div class="pad"><div class="card">
      <div class="row"><span class="av">${b.icon||''}</span>
      <span class="grow"><span class="b8 f65" style="display:block">${b.name}</span>
      <span class="nano">${b.sub||''}</span></span>
      ${b.pill?`<span class="pill">${b.pill}</span>`:''}</div>
      ${b.foot?`<div class="nano" style="margin-top:1.2mm">${b.foot}</div>`:''}
      ${b.actions?`<div class="row" style="gap:1.4mm;margin-top:1.6mm">${b.actions.map(a=>
        `<span class="pill">${a}</span>`).join('')}</div>`:''}
    </div></div>`),

  listrows: b => wrap(b, `<div class="pad"><div class="card" style="padding:0">
      ${b.items.map(([n,s,r],i)=>`<div class="row" style="padding:1.8mm 2mm;${i?'border-top:1px solid var(--hair)':''}">
        ${b.icons?`<span class="av">${b.icons[i]}</span>`:b.numbered?`<span class="av">${i+1}</span>`:''}
        <span class="grow"><span class="b7 f65" style="display:block">${n}</span><span class="nano">${s}</span></span>
        ${r?`<span class="pill">${r}</span>`:''}</div>`).join('')}
    </div></div>`),

  detailmeta: b => wrap(b, `<div class="pad">${b.items.map(t=>
      `<div class="row" style="margin-bottom:1.2mm"><span class="av" style="width:3.4mm;height:3.4mm"></span>
      <span class="tiny">${t}</span></div>`).join('')}</div>`),

  grower: b => wrap(b, `<div class="pad"><div class="card row">

      const N=21, finders=[[0,0],[0,14],[14,0]];
      const at=(r,c)=>finders.find(([fr,fc])=>r>=fr&&r<fr+7&&c>=fc&&c<fc+7);
      const near=(r,c)=>finders.some(([fr,fc])=>r>=fr-1&&r<=fr+7&&c>=fc-1&&c<=fc+7);
      let out='';
      for(let r=0;r<N;r++) for(let c=0;c<N;c++){
        const f=at(r,c);
        let on;
        if(f){ const dr=r-f[0], dc=c-f[1];
          on = dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4); }
        else if(near(r,c)) on=false;

/* Simplified mascot for the wireframe — outline only, print-safe.
   Head is drawn over the ears and horns so their inner ends are hidden;
   the held object is drawn over the arms so the tips read as hands. */
function cowWF(size, variant){
  const S='#6b6b6b', F='#fff', P='#e4e4e4';
  const arms = `<path d="M70 126q-8 32 18 44M130 126q8 32-18 44"
      stroke="${S}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const held = {
    heart: `${arms}
      <path d="M100 196c-16-12-28-20-28-32a14 14 0 0 1 28-7 14 14 0 0 1 28 7c0 12-12 20-28 32z"
        fill="${P}" stroke="${S}" stroke-width="4" stroke-linejoin="round"/>`,
    basket: `${arms}
      <circle cx="88" cy="166" r="9" fill="${F}" stroke="${S}" stroke-width="3.4"/>
      <circle cx="110" cy="163" r="10" fill="${P}" stroke="${S}" stroke-width="3.4"/>
      <path d="M68 170h64l-8 28a9 9 0 0 1-9 6H85a9 9 0 0 1-9-6z"
        fill="${F}" stroke="${S}" stroke-width="4" stroke-linejoin="round"/>`
  }[variant] || '';
  const h = variant==='heart' ? 210 : variant==='basket' ? 212 : 150;
  return `<svg width="${size}mm" height="${size*h/200}mm" viewBox="0 0 200 ${h}" class="mascot">
    <ellipse cx="40" cy="86" rx="17" ry="10" fill="${F}" stroke="${S}" stroke-width="4" transform="rotate(-18 40 86)"/>
    <ellipse cx="160" cy="86" rx="17" ry="10" fill="${F}" stroke="${S}" stroke-width="4" transform="rotate(18 160 86)"/>
    <path d="M76 46c-7-11 5-18 11-9M124 46c7-11-5-18-11-9" stroke="${S}" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="88" rx="52" ry="46" fill="${F}" stroke="${S}" stroke-width="4"/>
    <ellipse cx="76" cy="62" rx="17" ry="11" fill="${P}" transform="rotate(-18 76 62)"/>
    <ellipse cx="128" cy="58" rx="11" ry="7" fill="${P}" transform="rotate(18 128 58)"/>
    <path d="M70 88q8-11 16 0M114 88q8-11 16 0" stroke="${S}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="100" cy="112" rx="28" ry="18" fill="#fafafa" stroke="${S}" stroke-width="3.4"/>
    <path d="M90 112q10 9 20 0" stroke="${S}" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    ${held}
  </svg>`;
}

function render(blocks){

  purpose:'Structurally identical to screen 13 but inverted: spending instead of revenue, produce procured instead of sold. Named "Community Impact" rather than "Stats" because these are the figures a charity reports outward.',
  notes:[
    'Same four period ranges, including a custom date range sheet.',
    'Spending, completed pickup count, volume procured, and change against the previous period.',
    'Trend chart with period-appropriate axis labels.',
    'Category mix, useful for spotting reliance on a single produce type when planning menus.'
  ],
  inter:[
    ['Bars grow from zero on a stagger when the period changes.',1],
    ['Headline figures re-pop with a spring.',1],
    ['Category bars fill from the left on a stagger.',1]
  ],
  spec:'<code>2.a.vi.1</code> completed procurements, total spending, total produce procured; <code>2.a.vi.2</code> trends by weekly / monthly / annual / custom.' },

/* ---------------------------------------------------------------- 25 */
{ id:'c-profile', role:'charity', name:'Profile', file:'#c-profile',
  wf:[
    {t:'status'},
    {t:'appbar',title:'Profile',right:'⚙'},

    {t:'sect',text:'Personal details'},

    {t:'sect',text:'Procurement volume'},

    {t:'sect',text:'Recent procurements'},
    {t:'listrows',icons:['🌽','🥔'],items:[['Sweet Corn · 28 kg','Green Valley Farm · 09 Aug','$9'],['Potatoes · 50 kg','Hill Ridge · 02 Aug','$14']]},

    'Editable organisation details: name, number, address and ABN.',
    'Procurement volume by period, duplicated from screen 24.',

/* =====================================================================
   Page builders
   ===================================================================== */
const roleBadge = r => r==='charity'
  ? '<span class="badge charity">Charity / Volunteer</span>'
  : r==='farmer' ? '<span class="badge">Farmer / Producer</span>'
  : '<span class="badge">Shared</span>';

const foot = (l,r) => `<div class="pg-foot"><span>${l}</span><span>${r}</span></div>`;

function coverPage(){
  return `<section class="page cover" id="cover">
    <div class="logo">Farm<span class="g">Link</span></div>
    <div class="tag">Connecting fresh produce to brighter tomorrows.</div>
    <hr>
    <div class="title">Screen Sketches &amp; Annotations</div>
    <div style="font-size:10pt;color:var(--grey)">Low-fidelity wireframes for all 25 screens<br>across the farmer and charity/volunteer roles</div>
    <div class="meta">
      <b>25</b> annotated screens &nbsp;·&nbsp; <b>14</b> farmer &nbsp;·&nbsp; <b>11</b> charity<br>
      Derived from <i>Components of FarmLink App</i><br>
      and the working prototype in <code>index.html</code>
    </div>
    ${foot('FarmLink — Screen Sketches','Cover')}
  </section>`;
}

function indexPage(){
  const row = (s,i)=>`<tr>
      <td class="c">${String(i+1).padStart(2,'0')}</td>
      <td><b>${s.name}</b>
        <div class="nano" style="margin-top:.3mm">${s.role==='charity'?'Charity':s.role==='farmer'?'Farmer':'Shared'} · <code>${s.file}</code></div>
      </td>
    </tr>`;
  const half = Math.ceil(SCREENS.length/2);
  const tbl = list => `<table><thead><tr><th>#</th><th>Screen</th></tr></thead>
      <tbody>${list.map(([s,i])=>row(s,i)).join('')}</tbody></table>`;
  const idx = SCREENS.map((s,i)=>[s,i]);
  return `<section class="page" id="contents">
    <div class="pg-head"><span class="nm">Contents</span><span class="sp"></span>
      <span class="badge">25 screens</span></div>
    <div style="display:flex;gap:8mm;align-items:flex-start">
      <div style="flex:1;min-width:0">${tbl(idx.slice(0,half))}</div>
      <div style="flex:1;min-width:0">${tbl(idx.slice(half))}</div>
    </div>
    <p style="margin-top:5mm;line-height:1.55;font-size:7pt;color:var(--grey)">
      Deep links refer to fragment identifiers in the interactive prototype — opening
      <code>index.html#c-stats</code> loads that screen directly and switches to the matching role.
      Screens 01–14 are the farmer/producer tree; 15–25 are the charity/volunteer tree.
    </p>
    ${foot('FarmLink — Screen Sketches','Contents')}
  </section>`;
}

function legendPage(){
  const items = [
    [`<div class="wf-inner" style="border-radius:2mm;min-height:0">${P.appbar({back:true,title:'Title',right:'⚙'})}</div>`,
     'App bar','Back chevron on the left, centred title, optional action square on the right. A screen with no chevron is a bottom-nav destination and cannot be backed out of.'],
    [`<div class="pad" style="padding:0">${P.lines({w:[92,72,54]}).replace('class="b "','class="b"')}</div>`,
     'Text placeholder','Grey bars stand in for body copy whose exact wording is not decided. Real labels are typeset where the wording is load-bearing.'],
    [`<div class="img x" style="height:12mm">photo</div>`,
     'Image region','Dashed border with a diagonal cross marks a photo, gallery or camera viewport.'],
    [`<div>${P.btn({label:'Primary',style:'solid'})}${P.btn({label:'Secondary',style:'ghost'})}${P.btn({label:'Destructive',style:'danger'})}</div>`,
     'Buttons','Filled marks the primary action on a screen. Dashed outline is secondary or dismissive. Double outline is destructive and always opens a confirmation sheet.'],
    [`<div>${P.chips({items:['Active','Other','Third'],active:0})}</div>`,
     'Filter / sort chips','Horizontally scrolling single-select or multi-select row. The filled chip is the active selection.'],
    [`<div class="wf-inner" style="border-radius:2mm;min-height:0">${P.tabbar({items:['Home','Two','Three','Four','Five'],active:0})}</div>`,
     'Bottom navigation','Five persistent destinations. The heavier icon and darker label mark the current tab. Absent on modal and flow screens.'],
    [`<span class="pill">Available</span> <span class="pill dark">Locked-in</span>`,
     'Status pill','Listing lifecycle state. Four values are used: available, locked-in, completed, cancelled.'],
    [`<span class="co" style="position:static;display:inline-grid">3</span>`,
     'Callout marker','Numbered circle on the wireframe, keyed to the matching entry in the Annotations list beside it.']
  ];
  return `<section class="page" id="notation">
    <div class="pg-head"><span class="nm">Notation</span><span class="sp"></span>
      <span class="badge">How to read these sketches</span></div>
    <p class="purpose" style="margin-bottom:4mm">These are low-fidelity sketches: they fix layout, hierarchy and
      interaction, and deliberately leave colour, typography and final copy to the working prototype. Each screen
      is drawn at phone proportions with numbered callouts keyed to an annotation list.</p>
    <div class="legend-grid">
      ${items.map(([demo,t,d])=>`<div class="lg">
        <div class="demo">${demo}</div>
        <div class="txt"><b>${t}</b>${d}</div></div>`).join('')}
    </div>
    <p class="specref" style="margin-top:6mm">Filled circles in the <b>Interactions</b> list of each screen mark
      behaviour that is <b>animated</b> in the prototype. Hollow circles mark navigation or state changes with no
      motion attached.</p>
    ${foot('FarmLink — Screen Sketches','Notation')}
  </section>`;
}

function flowPage(){
  /* cont=true prefixes a leading arrow so a chain broken across two rows
     still reads as one continuous path. */
  const chain = (arr, cont) => (cont?'<span class="arr"></span>':'') + arr.map((b,i)=>
    `${i?'<span class="arr"></span>':''}<span class="fbox${b[1]?' alt':''}">${b[0]}</span>`).join('');
  return `<section class="page" id="flows">
    <div class="pg-head"><span class="nm">Task flows</span><span class="sp"></span>
      <span class="badge">Both roles</span></div>

    <h4 style="font-size:9pt;font-weight:800;margin:2mm 0 1mm">Farmer — post surplus and complete a sale</h4>
    <div class="flow">
      <div class="frow">${chain([['01 Splash'],['02 Home'],['03 Post Surplus'],['04 Hurray!'],['05 Nice!']])}</div>
      <div class="frow">${chain([['06 Active Listings'],['07 Listing Details'],['11 Chat — negotiate'],['07 Mark locked-in']])}</div>
      <div class="frow" style="padding-left:8mm">${chain([['08 Scan QR'],['05 Nice!']], true)}</div>
      <div class="frow">${chain([['12 Notifications'],['Approve contact ✓',1],['11 Chat']])}</div>
    </div>

    <h4 style="font-size:9pt;font-weight:800;margin:8mm 0 1mm">Charity — find, claim and collect</h4>
    <div class="flow">
      <div class="frow">${chain([['15 Home'],['16 Browse'],['17 Listing Details'],['18 Claimed!'],['19 Pickup QR']])}</div>
      <div class="frow">${chain([['22 Chat — negotiate'],['20 Ongoing Procurements'],['19 Show QR at gate'],['Farmer scans →',1]])}</div>
    </div>

    <h4 style="font-size:9pt;font-weight:800;margin:8mm 0 1mm">Listing lifecycle</h4>
    <div class="flow">
      <div class="frow">${chain([['Available'],['Locked-in'],['QR scanned'],['Completed']])}</div>
      <p style="margin:1mm 0 0;line-height:1.55;font-size:7.5pt">
        A lock-in cancelled by <i>either</i> party returns the listing to <b>Available</b>. Only a QR scan performed by
        the farmer moves a listing to <b>Completed</b> — neither side can mark a handover complete alone.
      </p>
    </div>

    <p class="specref" style="margin-top:8mm">The two roles meet at exactly two points: the chat thread, where a
      lock-in is negotiated, and the QR handshake at collection. Everything else is role-private. This is why the
      farmer and charity navigation trees are near-mirrors rather than a shared set of screens.</p>
    ${foot('FarmLink — Screen Sketches','Task flows')}
  </section>`;
}

function screenPage(s, i){
  const n = String(i+1).padStart(2,'0');
  return `<section class="page" id="s${n}">
    <div class="pg-head">
      <span class="num">${n}</span><span class="nm">${s.name}</span>
      <span class="sp"></span>${roleBadge(s.role)}
    </div>
    <div class="split">
      <div class="col-wf">
        <div class="wf"><div class="wf-inner">${render(s.wf)}</div></div>
        <div class="wf-cap">Prototype deep link · <code>index.html${s.file}</code></div>
      </div>
      <div class="col-notes">
        <div class="notes"><h4>Purpose</h4><p class="purpose">${s.purpose}</p></div>
        <div class="notes"><h4>Annotations</h4>
          <ul class="alist">${s.notes.map((t,k)=>
            `<li><span class="n">${k+1}</span><span>${t}</span></li>`).join('')}</ul></div>
        <div class="notes"><h4>Interactions &amp; motion</h4>
          <ul class="ilist">${s.inter.map(([t,anim])=>
            `<li class="${anim?'anim':''}">${t}</li>`).join('')}</ul></div>
        <div class="notes"><h4>Specification reference</h4><p class="specref">${s.spec}</p></div>
      </div>
    </div>
    ${foot('FarmLink — Screen Sketches',`${n} / 25 · ${s.name}`)}
  </section>`;
}

function gapsPage(){
  const gaps = [
    ['Authentication and sign-up','There is no log-in, registration, or initial "am I a farmer or a charity?" role-selection flow. The prototype switches roles through a sidebar control, which is a debugging affordance rather than a product path. The specification assumes accounts exist (it lists personal details and account deletion) without describing how they are created.'],
    ['Spatial context','Distance is the primary sort and filter axis for the charity, but it appears only as a line of text such as "12 km away". Collection is fundamentally a geographic problem and there is no map, no route estimate, and no sense of clustering — a charity cannot see that three listings sit on one road.'],
    ['Real QR encoding','The code on screen 19 renders the finder squares and timing lines of a genuine QR symbol so that it reads correctly as a code, but it encodes nothing. A working implementation needs a real encoder and a camera decoder, plus a signed payload so a screenshot of someone else\'s code cannot be replayed.'],
    ['Persistence','Nothing survives a reload. Posting a listing walks a fixed confirmation path rather than appending to the catalogue, editing a listing is a stub, and lock-ins, deletions and sent messages all reset. This limits how convincingly the prototype can be handed to someone else to explore.'],
    ['Accessibility','The prototype has no ARIA roles, no keyboard focus order, and no reduced-motion handling. Given how animation-dense the interface is, honouring the operating system\'s reduced-motion preference is the most pressing of these. Most interactive elements are non-semantic containers and are not reachable by keyboard or announced by a screen reader.'],
    ['Cancellation semantics','The specification allows either party to cancel a lock-in but does not say what happens to a listing cancelled repeatedly, whether a collection deadline that passes while locked-in reopens the listing automatically, or whether cancellations affect a participant\'s standing. These rules would need settling before implementation.']
  ];
  return `<section class="page" id="gaps">
    <div class="pg-head"><span class="nm">Known gaps &amp; open questions</span><span class="sp"></span>
      <span class="badge">For the next iteration</span></div>
    <p class="purpose" style="margin-bottom:5mm">Recorded here rather than left implicit in the sketches, so the
      boundary between what has been designed and what remains open is explicit.</p>
    <table><tbody>
      ${gaps.map(([t,d],i)=>`<tr>
        <td class="c">${String(i+1).padStart(2,'0')}</td>
        <td><b style="font-size:9pt">${t}</b>
        <div style="font-size:8pt;line-height:1.5;margin-top:1mm">${d}</div></td></tr>`).join('')}
    </tbody></table>
    ${foot('FarmLink — Screen Sketches','Known gaps')}
  </section>`;
}

/* ---------------------------------------------------------------- build */
document.getElementById('doc').innerHTML =
  coverPage() + indexPage() + legendPage() + flowPage() +
  SCREENS.map(screenPage).join('') + gapsPage();

/* Pages are built by script, so an #s07 anchor in the URL is resolved
   before its target exists — re-apply it once the document is in place. */
if (location.hash) {
  const target = document.querySelector(location.hash);
  if (target) target.scrollIntoView();
}

/* ?only=s07 isolates a single page, for reviewing or printing one sheet. */
const only = new URLSearchParams(location.search).get('only');
if (only) {
  document.querySelectorAll('.page').forEach(p => {
    if (p.id !== only) p.remove();
  });
}

/* Authoring aid: flag any page whose content exceeds one A4 sheet, which
   would silently spill onto an extra page when printed. Screen-only. */
(function checkOverflow(){
  const MM = 297 / 25.4 * 96;              // A4 height in CSS px at 96dpi
  const over = [];
  document.querySelectorAll('.page').forEach((p, i) => {
    if (p.scrollHeight > MM + 2) {
      p.dataset.overflow = 'yes';
      p.style.outline = '2px solid #c0392b';
      over.push(`p${i + 1} (${Math.round(p.scrollHeight - MM)}px)`);
    }
  });
  const el = document.getElementById('overflow');
  el.textContent = over.length
    ? `⚠ ${over.length} page(s) overflow A4: ${over.join(', ')}`
    : `✓ all ${document.querySelectorAll('.page').length} pages fit A4`;
  el.style.color = over.length ? '#ffb3a7' : '#a8e0a8';
})();
</script>
</body>
